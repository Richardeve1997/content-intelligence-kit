<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<style id="brand-tokens">
{{TOKENS}}
</style>
<style>
/* Every colour comes from the creator's tokens above. Muted text and lines are mixed from the ink and
   the canvas, so they follow the brand. The only literal colours here are greys. */
:root {
  color-scheme: light;
  --muted: color-mix(in srgb, var(--ink) 64%, var(--canvas));
  --line: color-mix(in srgb, var(--ink) 16%, var(--canvas));
  --soft: color-mix(in srgb, var(--ink) 6%, var(--canvas));
  --radius: 14px;
  --gutter: clamp(16px, 4.5vw, 56px);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--ink); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
ul, ol { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, h4, p, dl, dd { margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* Hero */
.hero { background: var(--field-dark); color: var(--on-field-dark); border-bottom: 6px solid var(--accent); padding: 44px 0 40px; }
.hero .kicker { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
.hero h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(36px, 6vw, 72px); line-height: 1.02; letter-spacing: -0.03em; margin-top: 14px; max-width: 18ch; text-wrap: balance; }
.hero .lede { font-size: clamp(18px, 1.8vw, 22px); line-height: 1.45; max-width: 52ch; margin-top: 18px; }
.banner { display: inline-block; margin-top: 22px; padding: 8px 14px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); }
.stats dt { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; order: 2; }
.stats div { display: flex; flex-direction: column; }
.stats dd { font-family: var(--font-display); font-size: clamp(34px, 5vw, 56px); font-weight: 600; letter-spacing: -0.03em; line-height: 1; margin-bottom: 8px; }

/* Sections */
section { padding-top: 64px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 3.6vw, 44px); line-height: 1.05; letter-spacing: -0.025em; }
.dek { color: var(--muted); max-width: 64ch; margin-top: 10px; }
.section-body { margin-top: 26px; }

/* How this run went */
.sources li { display: grid; grid-template-columns: 150px auto minmax(0, 1fr); gap: 6px 16px; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--line); }
.sources li:last-child { border-bottom: 1px solid var(--line); }
.sources .name { font-weight: 600; }
.sources .detail { color: var(--muted); }
.notices { margin-top: 28px; display: grid; gap: 8px; }
.notices li { padding: 12px 16px; background: var(--soft); border-left: 4px solid var(--accent); border-radius: 6px; }

/* Chips */
.chip { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border: 1px solid var(--ink); border-radius: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip.quiet { border-color: var(--line); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Ideas */
.ideas { display: grid; gap: 16px; }
.idea { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 24px; background: var(--field-light); border-radius: var(--radius); padding: 28px 30px; }
.idea .rank { font-family: var(--font-display); font-weight: 600; font-size: 84px; line-height: 0.85; letter-spacing: -0.04em; color: var(--accent); }
.idea h3 { font-family: var(--font-display); font-weight: 600; font-size: clamp(24px, 2.8vw, 34px); line-height: 1.1; letter-spacing: -0.02em; margin-top: 10px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 32px; margin-top: 18px; }
h4 { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.evidence, .hooklist { margin-top: 22px; }
.evidence li { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
.evidence .x, .score { font-family: var(--font-display); font-weight: 600; color: var(--ink); }
.evidence .x, .score.strong { color: var(--accent); }
.evidence .x { font-size: 22px; }
.hooklist ol { counter-reset: hook; }
.hooklist li { counter-increment: hook; display: grid; grid-template-columns: 34px minmax(0, 1fr); padding: 10px 0; border-top: 1px solid var(--line); font-family: var(--font-display); font-size: 19px; line-height: 1.3; }
.hooklist li::before { content: counter(hook); color: var(--muted); font-family: var(--font-mono); font-size: 13px; padding-top: 4px; }
.problem { background: var(--soft); border-left: 4px solid var(--accent); border-radius: 6px; padding: 18px 22px; margin-top: 22px; }
.problem li { margin-top: 6px; }

/* Videos */
.videos li { display: grid; grid-template-columns: 130px minmax(0, 1fr) 170px; gap: 22px; align-items: start; padding: 22px 0; border-top: 1px solid var(--line); }
.videos li:last-child { border-bottom: 1px solid var(--line); }
.score { font-size: clamp(34px, 4.6vw, 54px); line-height: 1; letter-spacing: -0.03em; }
.hook { font-family: var(--font-display); font-size: clamp(20px, 2.1vw, 26px); line-height: 1.2; letter-spacing: -0.012em; }
.hook q { quotes: none; }
.then { color: var(--muted); margin-top: 8px; }
.note { color: var(--muted); font-size: 15px; margin-top: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 15px; margin-top: 10px; }
.meta .who { color: var(--ink); font-weight: 600; }
.side { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.compact li { grid-template-columns: 90px minmax(0, 1fr) 170px; padding: 14px 0; }
.compact .score { font-size: 34px; }
.compact .hook { font-size: 18px; }

/* Creators */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th, td { text-align: left; padding: 11px 14px 11px 0; border-top: 1px solid var(--line); vertical-align: baseline; }
thead th { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-top: 0; }
tbody th { font-weight: 600; }
td.num, th.num { text-align: right; }

/* Shared links and notes */
.posts { display: grid; gap: 14px; margin-bottom: 22px; }
.post { background: var(--field-light); border-radius: var(--radius); padding: 22px 26px; }
.post .by { font-weight: 600; }
.post p.text { font-family: var(--font-display); font-size: 20px; line-height: 1.3; margin-top: 10px; white-space: pre-line; }
.post .numbers { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); margin-top: 12px; font-size: 15px; }
.unread li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.notes li { padding: 11px 0; border-top: 1px solid var(--line); }
h3.sub { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 26px 0 8px; }

/* Your own results */
.mine { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.mine li { background: var(--field-light); border-radius: var(--radius); padding: 18px 20px; }
.mine .score { font-size: 40px; }
.mine .title { font-weight: 600; margin-top: 6px; }
.patterns li { display: grid; grid-template-columns: 44px minmax(0, 1fr); padding: 14px 0; border-top: 1px solid var(--line); font-family: var(--font-display); font-size: 20px; line-height: 1.3; }
.patterns li::before { content: counter(pattern); counter-increment: pattern; font-family: var(--font-mono); font-size: 13px; color: var(--muted); padding-top: 5px; }
.patterns { counter-reset: pattern; margin-top: 22px; }

/* Footer */
footer { margin-top: 80px; padding: 34px 0 48px; border-top: 1px solid var(--line); color: var(--muted); font-size: 15px; }
footer p + p { margin-top: 10px; }

@media (max-width: 860px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .idea { grid-template-columns: minmax(0, 1fr); padding: 22px 20px; gap: 6px; }
  .idea .rank { font-size: 56px; }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .sources li { grid-template-columns: minmax(0, 1fr) auto; }
  .sources .detail { grid-column: 1 / -1; }
  .videos li, .compact li { grid-template-columns: 78px minmax(0, 1fr); gap: 4px 14px; }
  .videos .side { grid-column: 2; flex-direction: row; flex-wrap: wrap; align-items: center; }
}
</style>
</head>
<body>
{{BODY}}
</body>
</html>
